<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Cooking AI Supporter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='scripts.js') }}"></script>
</head>

<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="menu">
            <div class="menu-item">
                <button id="new-chat-btn" title="New Chat">
                    🆕 <span class="label">New chat</span>
                </button>
            </div>
            <div class="menu-item">
                <button id="history-btn" title="History">
                    📜 <span class="label">History</span>
                </button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h2 class="section-title">🍜 Cooking AI Supporter</h2>
        <div class="content">
            <h1 id="welcome-msg">Wanna cook? Ask me anything you want</h1>
            <div class="chat-box" id="chat-box"></div>
            <div class="input-container">
                <textarea placeholder="Ask anything" rows="1"></textarea>
                <button class="send-btn">▶</button>
            </div>
        </div>
    </div>
</body>

</html>
